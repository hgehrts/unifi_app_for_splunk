# Index & selector macros — EDIT THESE to match your environment.
# After editing, no restart is needed for macros (search-time).
#
# These are the only place indexes are hard-referenced. All searches,
# lookup-generators and dashboards use them.

# Where the UniFi TA (TA_unifi_ng) writes its data.
[unifi_index]
definition = index=unifi
iseval = 0

# Where UniFi device syslog (via Splunk Connect for Syslog) lands.
# Includes the sc4s source selector used in this environment.
[unifi_syslog_index]
definition = index=netops source=sc4s
iseval = 0

# ---------------------------------------------------------------------------
# Convenience search macros (built on the two index macros above).
# ---------------------------------------------------------------------------

# All UniFi syslog (any ubnt sourcetype), already enriched at search time
# (device_name / device_ip / client_name / vendor come from props LOOKUP-).
[unifi_syslog]
definition = `unifi_syslog_index` sourcetype=ubnt*
iseval = 0

# Latest known state per device, from the asset feed.
[unifi_devices]
definition = `unifi_index` sourcetype=unifi:device
iseval = 0

# Per-device performance telemetry.
[unifi_device_stats]
definition = `unifi_index` sourcetype=unifi:device:stats
iseval = 0

# Connected clients (asset).
[unifi_clients]
definition = `unifi_index` sourcetype=unifi:client
iseval = 0

# Normalize a colon MAC to lowercase-no-colon (device join key).
# Usage: `mac_nocolon(macAddress)`
[mac_nocolon(1)]
args = m
definition = replace(lower($m$),":","")
iseval = 0

# Derive a wifi disconnect flag from a hostapd/wevent message.
[is_disconnect]
definition = (("disassociated" OR "deauthenticated" OR "EVENT_STA_LEAVE" OR "sta_leave"))
iseval = 0
