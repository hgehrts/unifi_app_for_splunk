# Search-time enrichment of UniFi syslog (SC4S) sourcetypes.
# Applies to ubnt, ubnt:wireless, ubnt:dns. No reindexing — all search-time.
#
# Chain: extract device MAC / client MAC / proc / event / reason / rssi,
# then look up friendly device & client fields from the KV Store, and the
# client vendor from the OUI table.

[ubnt]
REPORT-unifi_devmac = unifi_extract_devmac
REPORT-unifi_model_fw = unifi_extract_model_fw
REPORT-unifi_proc = unifi_extract_proc
REPORT-unifi_clientmac = unifi_extract_clientmac
REPORT-unifi_wifi_event = unifi_extract_wifi_event
REPORT-unifi_kick_reason = unifi_extract_kick_reason
REPORT-unifi_rssi = unifi_extract_rssi
REPORT-unifi_stahtd_event = unifi_extract_stahtd_event
REPORT-unifi_stahtd_reason = unifi_extract_stahtd_reason
REPORT-unifi_link = unifi_extract_link
REPORT-unifi_poe = unifi_extract_poe
REPORT-unifi_fan = unifi_extract_fan
REPORT-unifi_temp = unifi_extract_temp
REPORT-unifi_login = unifi_extract_login_user, unifi_extract_login_exituser, unifi_extract_login_src, unifi_extract_login_result
LOOKUP-unifi_device = unifi_device_lookup device_mac_nocolon OUTPUT device_id device_name device_ip device_model device_state
LOOKUP-unifi_client = unifi_client_lookup client_mac OUTPUT client_name client_ip client_type uplink_device_id uplink_device_name
EVAL-client_oui = substr(replace(lower(client_mac),":",""),1,6)
LOOKUP-unifi_vendor = unifi_oui_lookup oui AS client_oui OUTPUT vendor AS client_vendor
# Severity from the SC4S-assigned syslog severity, plus a numeric rank for
# sorting/thresholds (higher = more severe).
FIELDALIAS-unifi_severity = sc4s_syslog_severity AS severity
EVAL-severity_rank = case(severity=="emerg",7,severity=="alert",6,severity=="crit",5,severity=="err",4,severity=="warning",3,severity=="notice",2,severity=="info",1,severity=="debug",0,true(),1)
# Normalized, dashboard-friendly action so users can filter/cluster by intent.
EVAL-event_action = case(\
  isnotnull(link_state),"link_".link_state,\
  isnotnull(poe_event),"poe_".poe_event,\
  match(_raw,"(?i)disassoc|deauth|EVENT_STA_LEAVE|sta_leave"),"disconnect",\
  match(_raw,"(?i)\bassociated\b|EVENT_STA_JOIN|sta_join"),"connect",\
  isnotnull(kick_reason),"kick",\
  match(lower(proc),"stahtd") AND match(_raw,"(?i)roam"),"roam",\
  match(_raw,"(?i)auth succeeded|Accepted (password|publickey)"),"login_success",\
  match(_raw,"(?i)Bad password|Failed password|Login attempt.*nonexist|auth failed"),"login_fail",\
  match(lower(proc),"ubnt-fanctrl"),"fan",\
  match(lower(proc),"dnsmasq|ubnt.*dns"),"dns",\
  match(_raw,"(?i)error|fail|fault|overload|critical"),"error",\
  true(),"other")

[ubnt:wireless]
REPORT-unifi_devmac = unifi_extract_devmac
REPORT-unifi_model_fw = unifi_extract_model_fw
REPORT-unifi_proc = unifi_extract_proc
REPORT-unifi_clientmac = unifi_extract_clientmac
REPORT-unifi_wifi_event = unifi_extract_wifi_event
REPORT-unifi_kick_reason = unifi_extract_kick_reason
REPORT-unifi_rssi = unifi_extract_rssi
LOOKUP-unifi_device = unifi_device_lookup device_mac_nocolon OUTPUT device_id device_name device_ip device_model device_state
LOOKUP-unifi_client = unifi_client_lookup client_mac OUTPUT client_name client_ip client_type uplink_device_id uplink_device_name
EVAL-client_oui = substr(replace(lower(client_mac),":",""),1,6)
LOOKUP-unifi_vendor = unifi_oui_lookup oui AS client_oui OUTPUT vendor AS client_vendor

[ubnt:dns]
REPORT-unifi_devmac = unifi_extract_devmac
REPORT-unifi_model_fw = unifi_extract_model_fw
REPORT-unifi_proc = unifi_extract_proc
LOOKUP-unifi_device = unifi_device_lookup device_mac_nocolon OUTPUT device_id device_name device_ip device_model device_state
