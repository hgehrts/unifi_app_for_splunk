# Search-time enrichment of UniFi syslog (SC4S) sourcetypes.
# Applies to ubnt, ubnt:wireless, ubnt:dns. No reindexing — all search-time.
#
# Chain: extract device MAC / client MAC / proc / event / reason / rssi,
# then look up friendly device & client fields from the KV Store, and the
# client vendor from the OUI table.

[ubnt]
REPORT-unifi_devmac = unifi_extract_devmac
REPORT-unifi_model_fw = unifi_extract_model_fw
REPORT-unifi_proc = unifi_extract_proc
REPORT-unifi_clientmac = unifi_extract_clientmac
REPORT-unifi_wifi_event = unifi_extract_wifi_event
REPORT-unifi_kick_reason = unifi_extract_kick_reason
REPORT-unifi_rssi = unifi_extract_rssi
REPORT-unifi_stahtd_event = unifi_extract_stahtd_event
REPORT-unifi_stahtd_reason = unifi_extract_stahtd_reason
LOOKUP-unifi_device = unifi_device_lookup device_mac_nocolon OUTPUT device_id device_name device_ip device_model device_state
LOOKUP-unifi_client = unifi_client_lookup client_mac OUTPUT client_name client_ip client_type uplink_device_id uplink_device_name
EVAL-client_oui = substr(replace(lower(client_mac),":",""),1,6)
LOOKUP-unifi_vendor = unifi_oui_lookup oui AS client_oui OUTPUT vendor AS client_vendor

[ubnt:wireless]
REPORT-unifi_devmac = unifi_extract_devmac
REPORT-unifi_model_fw = unifi_extract_model_fw
REPORT-unifi_proc = unifi_extract_proc
REPORT-unifi_clientmac = unifi_extract_clientmac
REPORT-unifi_wifi_event = unifi_extract_wifi_event
REPORT-unifi_kick_reason = unifi_extract_kick_reason
REPORT-unifi_rssi = unifi_extract_rssi
LOOKUP-unifi_device = unifi_device_lookup device_mac_nocolon OUTPUT device_id device_name device_ip device_model device_state
LOOKUP-unifi_client = unifi_client_lookup client_mac OUTPUT client_name client_ip client_type uplink_device_id uplink_device_name
EVAL-client_oui = substr(replace(lower(client_mac),":",""),1,6)
LOOKUP-unifi_vendor = unifi_oui_lookup oui AS client_oui OUTPUT vendor AS client_vendor

[ubnt:dns]
REPORT-unifi_devmac = unifi_extract_devmac
REPORT-unifi_model_fw = unifi_extract_model_fw
REPORT-unifi_proc = unifi_extract_proc
LOOKUP-unifi_device = unifi_device_lookup device_mac_nocolon OUTPUT device_id device_name device_ip device_model device_state
