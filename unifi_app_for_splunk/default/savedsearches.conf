# Lookup-generating searches that refresh the KV Store enrichment collections
# from the live TA data. Scheduled every 15 minutes.

[unifi - rebuild device lookup]
search = `unifi_devices` \
| stats latest(name) as device_name latest(macAddress) as device_mac \
        latest(ipAddress) as device_ip latest(model) as device_model \
        latest(state) as device_state by id \
| eval device_id=id, device_name=trim(device_name) \
| eval device_mac_nocolon=`mac_nocolon(device_mac)` \
| where isnotnull(device_mac_nocolon) AND device_mac_nocolon!="" \
| table device_mac_nocolon device_id device_name device_mac device_ip device_model device_state \
| outputlookup unifi_device_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = */15 * * * *
is_scheduled = 1
description = Rebuild the UniFi device enrichment KV Store from asset data.

[unifi - rebuild client lookup]
search = `unifi_clients` \
| stats latest(name) as client_name latest(ipAddress) as client_ip \
        latest(type) as client_type latest(uplinkDeviceId) as uplink_device_id \
        by macAddress \
| rename macAddress as client_mac \
| lookup unifi_device_by_id device_id AS uplink_device_id OUTPUT device_name AS uplink_device_name \
| table client_mac client_name client_ip client_type uplink_device_id uplink_device_name \
| outputlookup unifi_client_lookup
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 5,20,35,50 * * * *
is_scheduled = 1
description = Rebuild the UniFi client enrichment KV Store from asset data (after device lookup).
