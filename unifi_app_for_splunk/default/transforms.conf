# =====================  Lookup definitions  =====================

# Device enrichment (KV Store), keyed on normalized MAC (lower, no colons).
[unifi_device_lookup]
external_type = kvstore
collection = unifi_device_kv
fields_list = device_mac_nocolon, device_id, device_name, device_mac, device_ip, device_model, device_state

# Same collection, keyed by UUID (used to resolve uplink_device_id -> name).
[unifi_device_by_id]
external_type = kvstore
collection = unifi_device_kv
fields_list = device_id, device_name, device_mac, device_ip, device_model, device_state

# Client enrichment (KV Store), keyed on MAC with colons (matches syslog sta/mac).
[unifi_client_lookup]
external_type = kvstore
collection = unifi_client_kv
fields_list = client_mac, client_name, client_ip, client_type, uplink_device_id, uplink_device_name

# MAC OUI -> vendor (static CSV). Keyed on the 6-hex OUI (lower, no separators).
[unifi_oui_lookup]
filename = unifi_oui.csv
case_sensitive_match = false
min_matches = 0

# =====================  Syslog field extractions  =====================
# All anchored on the UniFi syslog _raw shape:
#   <devmac12>,<Model-FW>: <proc>[pid]: <message>

# Device MAC (12 hex) at the start of the line.
[unifi_extract_devmac]
REGEX = ^([0-9a-fA-F]{12}),
FORMAT = device_mac_nocolon::$1

# Model + firmware token (e.g. "U7-Pro-Max-8.6.11+18870").
[unifi_extract_model_fw]
REGEX = ^[0-9a-fA-F]{12},([^:]+):
FORMAT = device_model_fw::$1

# Daemon / process name (hostapd, stamgr, stahtd, kernel, wevent, mcad, ...).
[unifi_extract_proc]
REGEX = ^[0-9a-fA-F]{12},[^:]+:\s+([A-Za-z0-9_\-]+)(?:\[\d+\])?:
FORMAT = proc::$1

# Client MAC: covers hostapd "STA <mac>", stamgr "kick-sta(-on) <mac>",
# stahtd JSON "mac":"<mac>", wevent "<mac> /".
[unifi_extract_clientmac]
REGEX = (?i)(?:STA\s+|kick-sta(?:-on)?\s+|ignored\skick-sta-on\s+|"mac"\s*:\s*"|:\s)([0-9a-f]{2}(?::[0-9a-f]{2}){5})
FORMAT = client_mac::$1

# Wifi lifecycle event keyword.
[unifi_extract_wifi_event]
REGEX = (?i)\b(disassociated|deauthenticated|associated|authenticated|EVENT_STA_LEAVE|EVENT_STA_JOIN)\b
FORMAT = wifi_event::$1

# Kick / disconnect reason, e.g. "(reason:Low RSSI rssi:12)".
[unifi_extract_kick_reason]
REGEX = \(reason:([^)]+)\)
FORMAT = kick_reason::$1

# RSSI value if present.
[unifi_extract_rssi]
REGEX = (?i)\brssi:(\d+)
FORMAT = rssi::$1

# stahtd association-tracker JSON fields (best-effort top-level keys).
[unifi_extract_stahtd_event]
REGEX = "event_type"\s*:\s*"([^"]+)"
FORMAT = stahtd_event_type::$1

[unifi_extract_stahtd_reason]
REGEX = "sta_dc_reason"\s*:\s*"([^"]+)"
FORMAT = stahtd_dc_reason::$1

# --- v1.1.0: link / port / PoE / fan / temp ---

# Port link up/down (kernel): "Port 3 link up" / "Port 3 link down".
[unifi_extract_link]
REGEX = (?i)Port\s+(\d+)\s+link\s+(up|down)
FORMAT = port::$1 link_state::$2

# PoE port events (kernel/switch): "PoE port 5 ... enabled/disabled/overload".
[unifi_extract_poe]
REGEX = (?i)PoE.*?port\s+(\d+).*?(enabled|disabled|overload|fault|delivering|off|on)
FORMAT = poe_port::$1 poe_event::$2

# Fan controller (ubnt-fanctrl): speed %, pwm set/actual, rpm.
[unifi_extract_fan]
REGEX = (?i)Fan speed\s+(?<fan_speed_pct>\d+)%.*?pwm:\s*(?<fan_pwm_set>\d+)\s*\(set\)\s*/\s*(?<fan_pwm_actual>\d+)\s*\(actual\).*?fan rpm:\s*(?<fan_rpm>\d+)

# Device temperature (ubnt-fanctrl): "temp: 42" / "PSU temp: 42°C".
[unifi_extract_temp]
REGEX = (?i)\btemp:\s*(\d+)
FORMAT = device_temp_c::$1

# --- v1.1.0: device SSH login auditing (dropbear) ---
# "Password auth succeeded for 'admin' from 192.168.1.1:41602"
# "Child connection from 192.168.1.1:41602"
# "Exit (admin) from <192.168.1.1:41602>: Disconnect received"
[unifi_extract_login_user]
REGEX = (?i)(?:auth succeeded|password attempt|Login attempt)\s+for\s+'?(?<login_user>[^' ]+)'?\s+from
[unifi_extract_login_exituser]
REGEX = (?i)Exit\s+\((?<login_user>[^)]+)\)\s+from
[unifi_extract_login_src]
REGEX = (?i)from\s+<?(?<login_src_ip>\d{1,3}(?:\.\d{1,3}){3})(?::(?<login_src_port>\d+))?
[unifi_extract_login_result]
REGEX = (?i)(?<login_result>auth succeeded|Bad password attempt|Login attempt for nonexistent user|Exit before auth|Child connection)
