[install]
# The app ships working defaults (the unifi_index / unifi_syslog_index macros),
# so it is not gated behind mandatory setup. The Setup page is still available
# from the app nav for environments that need to change the indexes.
is_configured = true
state = enabled

[launcher]
author = UniFi App for Splunk
description = Consolidated dashboards and syslog correlation for UniFi gear. Enriches device/client IDs to names/IP/MAC and links telemetry, asset and syslog data with drilldowns. Companion to TA_unifi_ng.
version = 1.1.1

[ui]
is_visible = true
label = UniFi App for Splunk
supported_themes = light, dark
setup_view = setup

[package]
check_for_updates = true
id = unifi_app_for_splunk
